name: Deploy viewer to GitHub Pages
on:
  push:
    branches: [master]
    paths: ['web-viewer/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-viewer/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: web-viewer
      - run: npm run check
        working-directory: web-viewer
      - run: npm run build -- --base=/model/
        working-directory: web-viewer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-viewer/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
